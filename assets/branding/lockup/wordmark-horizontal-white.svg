<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" fill="none" role="img" aria-label="The Anatomy of Pace">
  <title>The Anatomy of Pace</title>
  <desc>Horizontal wordmark lockup, light version for dark backgrounds.</desc>
  <!-- Mark -->
  <g transform="translate(20,20) scale(0.78)" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 180 L120 24 L200 180"/>
    <path d="M82 150 L112 84 L138 138"/>
    <path d="M10 128 L96 128 L106 128 L114 106 L122 152 L130 62 L138 150 L146 128 L230 128"/>
  </g>
  <!-- Wordmark -->
  <g font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif">
    <text x="250" y="98" font-size="62" font-weight="700" letter-spacing="1.5" fill="#F2F5F7">THE ANATOMY</text>
    <text x="252" y="160" font-size="46" font-weight="400" letter-spacing="10" fill="#7FE9E6">OF PACE</text>
  </g>
</svg>
